name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (依赖与 wrapper 缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          else
            echo "::warning::未配置 secret SIGNING_KEYSTORE_BASE64，使用临时生成的签名密钥（每次构建签名不同）"
            keytool -genkeypair -v -keystore .signing/release.jks \
              -alias edge-securedns -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass edge-securedns -keypass edge-securedns \
              -dname "CN=Edge Secure DNS"
          fi
          echo "SIGNING_STORE_FILE=.signing/release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: ver
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "edge-securedns-$VERSION.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-securedns-${{ steps.ver.outputs.version }}
          path: edge-securedns-*.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: edge-securedns-*.apk
          generate_release_notes: true
