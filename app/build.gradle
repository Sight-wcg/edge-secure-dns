plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cyan.emmx.securedns'
    // compileSdk 34：AGP 7.4.x 自带的 aapt2 无法解析 android-35+ 平台的 resources.arsc，
    // 本模块只用到基础 API，用 34 即可获得所有环境开箱即用的构建。
    compileSdk 34

    defaultConfig {
        applicationId 'com.cyan.emmx.securedns'
        minSdk 26
        targetSdk 29
        versionCode 6
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            // 签名参数可用环境变量覆盖（GitHub Actions 构建用），未设置时用本地默认密钥。
            // 本地默认：.signing/edge-securedns.jks，密码均为 edge-securedns，alias edge-securedns。
            storeFile rootProject.file(System.getenv('SIGNING_STORE_FILE') ?: '.signing/edge-securedns.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'edge-securedns'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'edge-securedns'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'edge-securedns'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 现代 Xposed API（libxposed API 102），Maven Central 官方发布，compileOnly 不打包进 APK，
    // 运行时由框架（LSPosed 等支持现代 API 的实现）注入。
    // 注意：该构件是 Java 17 字节码，本地命令行构建需 JDK 17+（CI 已用 JDK 17）。
    compileOnly 'io.github.libxposed:api:102.0.0'
}
